<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyLine | Transaction History</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="style-overrides.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"></head>
<body><header><div class="brand-stack"><div class="logo"><a href="timeline.html">Sky<span>Line</span></a></div><span class="header-username" data-user-username></span></div><nav></nav></header>
<main class="wallet-dashboard transaction-history-page"><div class="wallet-hero compact-history-hero"><div><span class="eyebrow">SkyLine Wallet</span><h1>Transaction history</h1><p>Activity for account <strong data-user-account>—</strong></p></div><a href="wallet.html" class="wallet-history-button">← <span>Back to wallet</span></a></div>
<section class="wallet-section"><div id="transactionHistory" class="wallet-empty"><strong>Loading transactions…</strong></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-config.js"></script><script src="api-client.js"></script><script src="auth.js"></script><script src="Sky.js"></script><script src="ui.js"></script>
<script>(()=>{const fmt=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const box=document.getElementById('transactionHistory');try{const [wallet,tx]=await Promise.all([SkyLineAPI.wallet(),SkyLineAPI.transactions()]);document.querySelector('[data-user-account]').textContent=wallet.wallet.accountNumber||'—';const rows=tx.transactions||[];box.classList.remove('wallet-empty');if(!rows.length){box.className='wallet-empty';box.innerHTML='<strong>No transactions yet</strong><p>Your completed wallet activity will appear here.</p>';return;}box.innerHTML=rows.map(t=>`<div class="transaction-row"><div><b>${esc(t.description||t.type||'Transaction')}</b><small>${new Date(t.createdAt).toLocaleString()}</small></div><div><strong>${fmt(t.amount)}</strong><small>${esc(t.status||'completed')}</small></div></div>`).join('');}catch(e){box.className='wallet-empty';box.innerHTML='<strong>Unable to load transactions</strong><p>'+esc(e.message)+'</p>';}}load();})();</script></body></html>
