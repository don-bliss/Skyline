<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyLine | Verify Email</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="style-overrides.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header><div class="logo">Sky<span>Line</span></div><nav><a href="login.html">Login</a></nav></header>
<main class="verify-page"><section class="verify-card">
<h1>Verify your email</h1>
<p>Enter the one-time 6-digit code sent to <strong id="verifyEmail">your email address</strong>. The code expires after 10 minutes and can only be used once.</p>
<form id="verifyForm"><input id="verifyCode" class="verify-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required><button class="verify-btn" type="submit">Verify Email</button></form>
<div id="verifyMessage" class="verify-message"></div>
<p><button id="resendBtn" class="verify-btn" type="button" style="margin-top:8px;background:transparent;color:var(--sky);border:1px solid var(--line)">Resend code</button></p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-config.js?v=20260829-v18"></script><script src="api-client.js?v=20260829-v18"></script><script src="auth.js?v=20260829-v18"></script><script src="Sky.js?v=20260829-v18"></script><script>
(()=>{const pending=JSON.parse(sessionStorage.getItem('skylinePendingVerification')||'null');const emailEl=document.getElementById('verifyEmail'),codeEl=document.getElementById('verifyCode'),msg=document.getElementById('verifyMessage');if(!pending){location.replace('signup.html');return;}emailEl.textContent=pending.email;
function setMsg(t){msg.textContent=t;}
async function deliver(code){const endpoint=window.SKYLINE_CLOUD?.verificationEndpoint;if(window.SKYLINE_CLOUD?.enabled&&endpoint){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pending.email,code})});if(!r.ok)throw new Error('Unable to send the verification code right now.');return true;}return false;}
async function makeCode(){const p={...pending,code:String(Math.floor(100000+Math.random()*900000)),createdAt:Date.now(),expiresAt:Date.now()+600000,verified:false};sessionStorage.setItem('skylinePendingVerification',JSON.stringify(p));const sent=await deliver(p.code);setMsg(sent?'A new verification code was sent to your email.':'Local test mode: your new verification code is '+p.code+'.');}
document.getElementById('verifyForm').addEventListener('submit',e=>{e.preventDefault();const p=JSON.parse(sessionStorage.getItem('skylinePendingVerification')||'null');const entered=codeEl.value.trim();if(!p||Date.now()>p.expiresAt){setMsg('This code has expired. Request a new one.');return;}if(entered!==p.code){setMsg('Incorrect verification code. Please try again.');return;}p.verified=true;if(!window.SKYLINE_CLOUD?.enabled){if(!window.skylineMarkLocalEmailVerified?.(p.email)){setMsg('Verification completed, but the account could not be updated. Please try again.');return;}}sessionStorage.setItem('skylineEmailVerified',p.email);sessionStorage.removeItem('skylinePendingVerification');setMsg('Email verified successfully. Redirecting to login...');setTimeout(()=>location.replace('login.html?verified=1'),900);});
document.getElementById('resendBtn').addEventListener('click',async()=>{try{await makeCode();}catch(e){setMsg(e.message);}});
setMsg(window.SKYLINE_CLOUD?.enabled?'Check your email for the verification code.':'Local test mode: your verification code is '+pending.code+'.');
})();
</script><script src="ui.js?v=20260829-v18"></script>
</body></html>
