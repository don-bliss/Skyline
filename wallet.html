<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkyLine | Wallet</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="style-overrides.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"></head><body><header><div class="brand-stack"><div class="logo"><a href="timeline.html">Sky<span>Line</span></a></div><span class="header-username" data-user-username></span></div><nav></nav></header>
<main class="wallet-dashboard"><div class="wallet-hero"><div><span class="eyebrow">SkyLine Wallet</span><h1 data-user-name>SkyLine User</h1><p>Account <strong data-user-account>0000000000</strong></p></div><div class="wallet-balance-large"><small>Available balance</small><strong data-user-balance>₦0.00</strong></div></div><div class="wallet-actions-grid"><button data-wallet-action="add"><span>＋</span><b>Add Money</b><small>Fund wallet</small></button><button data-wallet-action="transfer"><span>⇄</span><b>Transfer</b><small>Send money</small></button><button onclick="location.href='crypto.html'"><span>↗</span><b>Exchange</b><small>Buy or sell crypto</small></button><button data-wallet-action="bills"><span>▣</span><b>Bills Payment</b><small>Pay bills</small></button><button data-wallet-action="gift"><span>▤</span><b>Gift Cards</b><small>Buy or sell</small></button><button data-wallet-action="withdraw"><span>↙</span><b>Withdraw</b><small>Bank dashboard</small></button><button data-wallet-action="history"><span>◷</span><b>Transactions</b><small>View history</small></button><button data-wallet-action="more"><span>•••</span><b>More</b><small>Coming soon</small></button></div><section class="wallet-section"><h2>Recent activity</h2><div class="wallet-empty"><strong>No transactions yet</strong><p>Your transaction history will appear here once your secure wallet backend is connected.</p></div></section></main><div class="wallet-modal" id="walletModal"><div class="wallet-modal-card"><button class="wallet-modal-close" id="walletModalClose">×</button><h2 id="walletModalTitle">SkyLine Wallet</h2><p id="walletModalText">This feature is prepared for the secure backend.</p><button class="composer-submit" id="walletModalOk">Continue</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-config.js?v=20260830-v19"></script><script src="api-client.js?v=20260830-v19"></script><script src="auth.js?v=20260830-v19"></script><script src="Sky.js?v=20260830-v19"></script><script src="ui.js?v=20260830-v19"></script><script>document.querySelectorAll('[data-wallet-action]').forEach(b=>b.addEventListener('click',()=>{const map={add:['Add Money','Add funds securely through a connected payment provider.' ],transfer:['Transfer','Send money securely after backend verification is enabled.'],bills:['Bills Payment','Utilities and billers will be connected to the production payment API.'],gift:['Gift Cards','Choose Buy or Sell to continue once gift-card services are connected.'],withdraw:['Withdraw','Withdraw to your verified bank account through the secure payment service.'],history:['Transactions','Your verified transaction history will appear here.'],more:['More','Additional SkyLine financial features will be added here.']};const x=map[b.dataset.walletAction]||map.more;document.getElementById('walletModalTitle').textContent=x[0];document.getElementById('walletModalText').textContent=x[1];document.getElementById('walletModal').classList.add('show');}));document.getElementById('walletModalClose').onclick=()=>document.getElementById('walletModal').classList.remove('show');document.getElementById('walletModalOk').onclick=()=>document.getElementById('walletModal').classList.remove('show');</script></body></html>
