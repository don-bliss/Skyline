<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkyLine | Community Room</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="style-overrides.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"></head><body><header><div class="brand-stack"><div class="logo"><a href="timeline.html">Sky<span>Line</span></a></div><span class="header-username" data-user-username></span></div><nav></nav></header><main class="community-page"><a class="community-back" href="timeline.html">← Back to Timeline</a><div class="community-room-card"><span class="eyebrow">SkyLine Community</span><h1 id="roomTitle">Community Room</h1><p id="roomDescription">Join the conversation with people around the world.</p><div class="room-status"><span class="room-live-dot"></span><span id="roomMembers">Community chat</span></div><div class="room-messages" id="roomMessages"></div><form class="room-form" id="roomForm"><input id="roomInput" maxlength="300" autocomplete="off" placeholder="Write a message..."><button type="submit">Send</button></form></div></main><script src="Sky.js?v=20260829-v13"></script><script src="ui.js?v=20260829-v13"></script><script>\n(() => {\n const rooms={football:{title:'Football Room',desc:'Match talk, clubs, players and football culture from around the world.',members:'12,840 people in this room'},music:{title:'Music Room',desc:'Artists, new releases, playlists and music conversations.',members:'8,420 people in this room'},entertainment:{title:'Entertainment Room',desc:'Movies, series, celebrities, gaming and everything entertaining.',members:'15,230 people in this room'},politics:{title:'Politics Room',desc:'Current affairs and political conversations from different parts of the world.',members:'9,610 people in this room'}};\n const key=new URLSearchParams(location.search).get('room')||'football'; const room=rooms[key]||rooms.football;\n document.getElementById('roomTitle').textContent=room.title; document.getElementById('roomDescription').textContent=room.desc; document.getElementById('roomMembers').textContent=room.members;\n const list=document.getElementById('roomMessages'); const messages=[['GlobalFan','Welcome everyone!'],['SkyLine User','Glad to join the room.'],['Community Bot','Be respectful and enjoy the conversation.']];\n const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); const render=()=>{list.innerHTML=messages.map(m=>`<div class="room-message"><strong>${esc(m[0])}</strong><span>${esc(m[1])}</span></div>`).join('');list.scrollTop=list.scrollHeight;}; render();\n document.getElementById('roomForm').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('roomInput');if(!i.value.trim())return;let name='SkyLine User';try{name=JSON.parse(localStorage.getItem('skylineUser')||'null')?.name||name}catch(_){} messages.push([name,i.value.trim()]);i.value='';render();});\n})();\n</script></body></html>
