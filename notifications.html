<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkyLine | Notifications</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="style-overrides.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"></head><body>
<header><div class="logo">Sky<span>Line</span></div><nav></nav></header>
<main class="info-page"><h1>Notifications</h1><p>Likes, comments and follows from your SkyLine community.</p><div id="skylineNotifications" class="info-grid"><div class="info-card"><p>Loading notifications…</p></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-config.js?v=20261102-v26"></script><script src="api-client.js?v=20261102-v26"></script><script src="auth.js?v=20261102-v26"></script><script src="Sky.js?v=20261102-v26"></script><script src="ui.js?v=20261102-v26"></script><script>
(()=>{const root=document.getElementById('skylineNotifications');if(!root)return;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{if(!window.SkyLineAPI?.isConfigured?.())throw new Error('Connect the SkyLine API to load cloud notifications.');const data=await window.SkyLineAPI.notifications();const items=data.notifications||[];root.innerHTML=items.length?items.map(n=>`<article class="info-card"><p>${esc(n.message)}</p><small>${esc(new Date(n.created_at).toLocaleString())}</small>${n.read_at?'':'<button type="button" data-read="'+esc(n.id)+'">Mark as read</button>'}</article>`).join(''):'<div class="info-card"><h3>You're all caught up</h3><p>No notifications yet.</p></div>';}catch(e){root.innerHTML=`<div class="info-card"><p>${esc(e.message)}</p></div>`;}}root.addEventListener('click',async e=>{const b=e.target.closest('[data-read]');if(!b)return;try{await window.SkyLineAPI.markNotificationRead(b.dataset.read);load();}catch(err){alert(err.message);}});document.addEventListener('DOMContentLoaded',load);setTimeout(load,0);})();
</script></body></html>
